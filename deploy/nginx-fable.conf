# Nginx do VPS -> containers do Fable (portas presas em 127.0.0.1 no compose).
# Copiar para /etc/nginx/sites-available/fable e ativar (ver DEPLOY_HOSTINGER.md).
# O Certbot acrescenta sozinho os blocos de HTTPS (porta 443) depois.

# Frontend
server {
    listen 80;
    server_name fable.amsx.online;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 80;
    server_name api.fable.amsx.online;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
